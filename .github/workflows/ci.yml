# Automated build checks for clocksync evolved by axelaberg91.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Logic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run existing logic tests
        run: |
          g++ -std=c++17 -O2 tests/logic_test.cpp -o "$RUNNER_TEMP/clocksync-logic-test"
          "$RUNNER_TEMP/clocksync-logic-test"

  atom:
    name: Atom Lite build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ARDUINO_CLI_VERSION: 1.5.1
      ARDUINO_CLI_ARCHIVE_SHA256: 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b
      M5STACK_CORE_VERSION: 3.3.10
      M5STACK_INDEX_URL: https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
      ATOM_FQBN: m5stack:esp32:m5stack_atom:PartitionScheme=huge_app
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Arduino CLI
        run: |
          archive="$RUNNER_TEMP/arduino-cli.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          printf '%s  %s\n' "$ARDUINO_CLI_ARCHIVE_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/arduino-cli-bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/arduino-cli-bin" arduino-cli
          echo "$RUNNER_TEMP/arduino-cli-bin" >> "$GITHUB_PATH"

      - name: Cache Arduino board tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.arduino15
          key: arduino-${{ runner.os }}-${{ runner.arch }}-cli-${{ env.ARDUINO_CLI_VERSION }}-m5stack-${{ env.M5STACK_CORE_VERSION }}

      - name: Install pinned M5Stack core
        run: |
          arduino-cli core update-index --additional-urls "$M5STACK_INDEX_URL"
          arduino-cli core install "m5stack:esp32@${M5STACK_CORE_VERSION}" --additional-urls "$M5STACK_INDEX_URL"

      - name: Prepare a sketch without private credentials
        run: |
          if [ -n "$(git ls-files -- secrets.h secret.h)" ]; then
            echo 'Private credential files must not be tracked in Git.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/clocksync"
          cp clocksync.ino time_policy.h time_zones.h web_ui.h wifi_config.h "$RUNNER_TEMP/clocksync/"

      - name: Build Wi-Fi portal configuration
        run: arduino-cli compile --fqbn "$ATOM_FQBN" --build-path "$RUNNER_TEMP/build-portal" "$RUNNER_TEMP/clocksync"

      - name: Build example credentials configuration
        run: |
          cp secrets_example.h "$RUNNER_TEMP/clocksync/secrets.h"
          arduino-cli compile --fqbn "$ATOM_FQBN" --build-path "$RUNNER_TEMP/build-example" "$RUNNER_TEMP/clocksync"
